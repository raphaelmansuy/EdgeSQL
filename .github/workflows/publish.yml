name: Publish to PyPI

# Runs when you publish a GitHub release, or by hand from the Actions tab.
# Needs a PyPI trusted publisher for this repository and the "pypi" environment.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, do not upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the metadata
        run: python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import edgesql, importlib.metadata as m; print(m.version('edgesql'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run the library tests
        run: python -m pytest -q tests --ignore=tests/test_screen.py

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'release' || inputs.dry_run == false
    environment:
      name: pypi
      url: https://pypi.org/p/edgesql
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
