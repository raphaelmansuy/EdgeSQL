[project]
name = "edgesql"
version = "0.1.0"
description = "EdgeSQL changes SQL on a typed tree for Postgres and Databricks."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Raphael Mansuy" }]
maintainers = [{ name = "Raphael Mansuy" }]
readme = "README.md"
keywords = ["sql", "postgres", "databricks", "sqlglot", "ast", "query-rewrite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["sqlglot==30.25.0"]

[project.urls]
Homepage = "https://github.com/raphaelmansuy/EdgeSQL"
Repository = "https://github.com/raphaelmansuy/EdgeSQL"
Documentation = "https://raphaelmansuy.github.io/EdgeSQL/"
Changelog = "https://github.com/raphaelmansuy/EdgeSQL/blob/main/CHANGELOG.md"
Issues = "https://github.com/raphaelmansuy/EdgeSQL/issues"
Author = "https://www.linkedin.com/in/raphaelmansuy/"
LinkedIn = "https://www.linkedin.com/in/raphaelmansuy/"

[project.optional-dependencies]
postgres = ["pglast>=7"]
dev = [
  "pytest>=8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.32",
  "playwright>=1.48",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["edgesql", "edgesql.dialects"]

[tool.setuptools.package-data]
edgesql = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "BLE", "FURB", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
"tools/*" = ["E402"]
